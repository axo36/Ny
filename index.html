<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8"/>
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>

<title>JETLAG AI • Premium</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#020617;
    --glass:rgba(255,255,255,0.08);
    --glass2:rgba(255,255,255,0.04);
    --border:rgba(255,255,255,0.12);
    --white:#ffffff;
    --blue:#60a5fa;
    --cyan:#67e8f9;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000814;
    font-family:'Inter',sans-serif;
}

/* ===================================================
   BACKGROUND CINÉMATIQUE
=================================================== */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
    radial-gradient(circle at top,
    #0f172a 0%,
    #020617 45%,
    #000000 100%);
}

.glow1,
.glow2,
.glow3{
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
}

.glow1{
    width:500px;
    height:500px;
    background:rgba(96,165,250,0.18);
    top:-180px;
    left:-120px;
    animation:float1 18s ease-in-out infinite;
}

.glow2{
    width:420px;
    height:420px;
    background:rgba(103,232,249,0.12);
    bottom:-150px;
    right:-120px;
    animation:float2 22s ease-in-out infinite;
}

.glow3{
    width:260px;
    height:260px;
    background:rgba(255,255,255,0.06);
    top:35%;
    left:45%;
    animation:float3 14s ease-in-out infinite;
}

@keyframes float1{
    0%{transform:translate(0,0);}
    50%{transform:translate(50px,40px);}
    100%{transform:translate(0,0);}
}

@keyframes float2{
    0%{transform:translate(0,0);}
    50%{transform:translate(-40px,-50px);}
    100%{transform:translate(0,0);}
}

@keyframes float3{
    0%{transform:translate(0,0);}
    50%{transform:translate(20px,-25px);}
    100%{transform:translate(0,0);}
}

/* ===================================================
   ÉTOILES
=================================================== */

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:0.7;
    animation:twinkle 3s infinite;
}

@keyframes twinkle{
    0%{opacity:0.15;}
    50%{opacity:1;}
    100%{opacity:0.15;}
}

/* ===================================================
   AVION
=================================================== */

.plane{
    position:absolute;
    top:20%;
    left:-80px;
    font-size:24px;
    opacity:0.85;
    animation:fly 30s linear infinite;
    filter:drop-shadow(0 0 10px rgba(255,255,255,0.35));
}

@keyframes fly{
    from{
        transform:translateX(0) translateY(0);
    }

    50%{
        transform:translateX(60vw) translateY(-15px);
    }

    to{
        transform:translateX(130vw) translateY(0);
    }
}

/* ===================================================
   APP
=================================================== */

.app{
    position:relative;
    z-index:5;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;

    /*
        PLUS GRAND :
        prend tout l’écran
    */

    padding:
    max(28px, env(safe-area-inset-top))
    18px
    max(28px, env(safe-area-inset-bottom));

    color:white;
}

/* ===================================================
   TOP
=================================================== */

.top{
    width:100%;
    text-align:center;
}

.logo{
    font-size:1rem;
    letter-spacing:7px;
    opacity:0.72;
    margin-bottom:22px;
    font-weight:600;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 20px;
    border-radius:999px;

    background:var(--glass);
    border:1px solid var(--border);

    backdrop-filter:blur(20px);

    font-size:0.9rem;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 15px #22c55e;
    animation:pulse 1.8s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.5);}
    100%{transform:scale(1);}
}

/* ===================================================
   CENTER
=================================================== */

.center{
    flex:1;

    display:flex;
    justify-content:center;
    align-items:center;
}

.clock-card{

    /*
        ÉNORME carte verticale
    */

    width:100%;
    height:100%;

    max-height:560px;

    border-radius:42px;

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,0.10),
        rgba(255,255,255,0.05)
    );

    border:1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(35px);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    position:relative;

    overflow:hidden;

    box-shadow:
    0 0 80px rgba(96,165,250,0.12);
}

/* reflet premium */

.clock-card::before{
    content:"";
    position:absolute;

    top:-20%;
    left:-40%;

    width:180%;
    height:40%;

    transform:rotate(-12deg);

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.08),
        transparent
    );

    animation:shine 10s linear infinite;
}

@keyframes shine{
    from{
        transform:
        rotate(-12deg)
        translateX(-40%);
    }

    to{
        transform:
        rotate(-12deg)
        translateX(40%);
    }
}

.label{
    font-size:0.95rem;
    letter-spacing:5px;
    opacity:0.7;
    margin-bottom:26px;
}

.clock{

    font-size:6.5rem;

    font-weight:700;

    line-height:1;

    letter-spacing:3px;

    text-shadow:
    0 0 18px rgba(255,255,255,0.18),
    0 0 40px rgba(96,165,250,0.45),
    0 0 70px rgba(103,232,249,0.22);
}

.city{
    margin-top:26px;
    font-size:1.05rem;
    letter-spacing:5px;
    opacity:0.75;
}

.small{
    margin-top:22px;
    width:78%;
    text-align:center;
    line-height:1.7;
    font-size:0.92rem;
    opacity:0.55;
}

/* ===================================================
   BOTTOM
=================================================== */

.bottom{
    width:100%;
    margin-top:18px;
}

.panel{
    width:100%;

    border-radius:30px;

    padding:24px;

    background:var(--glass2);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(25px);
}

.row{
    display:flex;
    justify-content:space-between;
    margin-bottom:18px;
    font-size:0.95rem;
}

.progress{
    width:100%;
    height:12px;

    border-radius:999px;

    overflow:hidden;

    background:rgba(255,255,255,0.08);
}

.progress-bar{
    width:0%;
    height:100%;
    border-radius:999px;

    background:
    linear-gradient(
        90deg,
        #3b82f6,
        #60a5fa,
        #67e8f9
    );

    box-shadow:
    0 0 18px rgba(96,165,250,0.4);
}

.info{
    margin-top:18px;
    text-align:center;
    line-height:1.7;
    opacity:0.75;
    font-size:0.92rem;
}

/* ===================================================
   RESPONSIVE IPHONE 12
=================================================== */

@media(max-width:430px){

    .clock{
        font-size:5.4rem;
    }

    .clock-card{
        max-height:none;
    }

}

</style>
</head>

<body>

<div class="background">

    <div class="glow1"></div>
    <div class="glow2"></div>
    <div class="glow3"></div>

</div>

<div class="plane">✈︎</div>

<div class="app">

    <!-- TOP -->

    <div class="top">

        <div class="logo">
            JETLAG AI
        </div>

        <div class="status">

            <div class="dot"></div>

            <span id="status">
                En attente du décollage réel
            </span>

        </div>

    </div>

    <!-- CENTER -->

    <div class="center">

        <div class="clock-card">

            <div class="label">
                HEURE CIRCADIENNE
            </div>

            <div class="clock" id="clock">
                00:00
            </div>

            <div class="city" id="city">
                NEW YORK
            </div>

            <div class="small" id="small">
                Synchronisation progressive ultra précise du rythme biologique entre New York et Paris.
            </div>

        </div>

    </div>

    <!-- BOTTOM -->

    <div class="bottom">

        <div class="panel">

            <div class="row">
                <span>Adaptation biologique</span>
                <span id="percent">0%</span>
            </div>

            <div class="progress">
                <div class="progress-bar" id="bar"></div>
            </div>

            <div class="info" id="info">
                Le système attend le départ réel de l’avion
            </div>

        </div>

    </div>

</div>

<script>

/* ===================================================
   ÉTOILES
=================================================== */

for(let i=0;i<180;i++){

    const s=document.createElement("div");

    s.className="star";

    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";

    s.style.opacity=Math.random();

    s.style.animationDelay=
    Math.random()*3+"s";

    document.body.appendChild(s);
}

/* ===================================================
   CONFIG
=================================================== */

const DESTINATION_OFFSET=6;
const FLIGHT_DURATION=7;

/* ===================================================
   ÉTAT VOL
=================================================== */

let started=false;
let flightStart=0;

/* ===================================================
   DÉMARRAGE SMART
=================================================== */

function startFlight(){

    if(started) return;

    started=true;

    flightStart=Date.now();

    localStorage.setItem(
        "flightStart",
        flightStart
    );

    document.getElementById("status")
    .innerText=
    "Vol détecté • synchronisation active";
}

/*
    Le vol démarre SEULEMENT :

    - si plus internet
    - pendant 2 minutes
    - ET téléphone verrouillé/réveillé

    donc beaucoup plus fiable.
*/

window.addEventListener("offline",()=>{

    setTimeout(()=>{

        if(!navigator.onLine){

            startFlight();
        }

    },120000);
});

/* double tap manuel ultra discret */

document.body.addEventListener(
"dblclick",
()=>startFlight()
);

/* restore */

const saved=
localStorage.getItem("flightStart");

if(saved){

    started=true;
    flightStart=Number(saved);

    document.getElementById("status")
    .innerText="Vol en cours";
}

/* ===================================================
   HORLOGE
=================================================== */

function update(){

    const now=new Date();

    let progress=0;
    let shift=0;

    if(started){

        const elapsed=
        Date.now()-flightStart;

        const total=
        FLIGHT_DURATION*
        60*
        60*
        1000;

        progress=
        Math.min(elapsed/total,1);

        /*
            Courbe ultra naturelle
        */

        const smooth=
        (1-Math.cos(progress*Math.PI))/2;

        shift=
        DESTINATION_OFFSET*smooth;
    }

    /*
        Heure parfaitement fluide
    */

    const adapted=
    new Date(
        now.getTime()+
        shift*3600000
    );

    const h=
    String(adapted.getHours())
    .padStart(2,"0");

    const m=
    String(adapted.getMinutes())
    .padStart(2,"0");

    document.getElementById("clock")
    .innerText=`${h}:${m}`;

    /* villes */

    if(progress<0.18){

        document.getElementById("city")
        .innerText="NEW YORK";

    }else if(progress<0.82){

        document.getElementById("city")
        .innerText="OCÉAN ATLANTIQUE";

    }else{

        document.getElementById("city")
        .innerText="PARIS";
    }

    /* ui */

    document.getElementById("bar")
    .style.width=
    (progress*100)+"%";

    document.getElementById("percent")
    .innerText=
    Math.round(progress*100)+"%";

    document.getElementById("info")
    .innerHTML=
    started
    ? `Décalage actuel : +${shift.toFixed(2)}h • transition biologique fluide`
    : `Le système attend le vrai décollage de l’avion`;

    requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
