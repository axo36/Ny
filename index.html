<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8"/>

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
viewport-fit=cover,
maximum-scale=1.0,
user-scalable=no"/>

<title>JETLAG AI • Smart Flight</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Inter',sans-serif;
    background:#020617;
    color:white;
}

body{

    background:
    radial-gradient(circle at top,
    #0f172a 0%,
    #020617 45%,
    #000000 100%);
}

/* ===================================================== */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
}

.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(120px);
}

.glow1{
    width:500px;
    height:500px;
    background:rgba(96,165,250,0.16);
    top:-200px;
    left:-140px;
}

.glow2{
    width:400px;
    height:400px;
    background:rgba(103,232,249,0.10);
    right:-120px;
    bottom:-120px;
}

/* ===================================================== */

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:white;
    opacity:0.7;
    animation:twinkle 3s infinite;
}

@keyframes twinkle{

    0%{opacity:0.2;}
    50%{opacity:1;}
    100%{opacity:0.2;}
}

/* ===================================================== */

.plane{

    position:absolute;

    top:18%;

    left:-100px;

    font-size:24px;

    opacity:0.9;

    animation:fly 30s linear infinite;
}

@keyframes fly{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(140vw);
    }
}

/* ===================================================== */

.app{

    position:relative;
    z-index:10;

    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    padding:
    max(24px, env(safe-area-inset-top))
    18px
    max(24px, env(safe-area-inset-bottom));
}

/* ===================================================== */

.top{

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:16px;
}

.logo{

    font-size:1rem;

    letter-spacing:8px;

    opacity:0.75;

    font-weight:600;
}

.status{

    padding:14px 22px;

    border-radius:999px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.10);

    backdrop-filter:blur(20px);

    font-size:0.92rem;
}

/* ===================================================== */

.center{

    flex:1;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:18px 0;
}

/* ===================================================== */

.card{

    width:100%;
    height:100%;

    border-radius:40px;

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,0.10),
        rgba(255,255,255,0.04)
    );

    border:1px solid rgba(255,255,255,0.10);

    backdrop-filter:blur(30px);

    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    align-items:center;

    overflow:hidden;

    position:relative;
}

.card::before{

    content:"";

    position:absolute;

    top:-20%;
    left:-40%;

    width:180%;
    height:40%;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.08),
        transparent
    );

    transform:rotate(-12deg);

    animation:shine 10s linear infinite;
}

@keyframes shine{

    from{
        transform:
        rotate(-12deg)
        translateX(-40%);
    }

    to{
        transform:
        rotate(-12deg)
        translateX(40%);
    }
}

/* ===================================================== */

.label{

    font-size:1rem;

    letter-spacing:6px;

    opacity:0.7;
}

.clock{

    font-size:7rem;

    font-weight:700;

    line-height:1;

    text-shadow:
    0 0 18px rgba(255,255,255,0.15),
    0 0 40px rgba(96,165,250,0.40);
}

.city{

    font-size:1.1rem;

    letter-spacing:6px;

    opacity:0.78;
}

/* ===================================================== */

.zone{

    padding:14px 18px;

    border-radius:24px;

    background:rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.08);

    font-size:0.92rem;

    text-align:center;

    width:88%;
}

/* ===================================================== */

.progress-wrap{

    width:88%;
}

.row{

    display:flex;
    justify-content:space-between;

    margin-bottom:14px;

    font-size:0.95rem;
}

.progress{

    width:100%;
    height:14px;

    overflow:hidden;

    border-radius:999px;

    background:rgba(255,255,255,0.08);
}

.bar{

    width:0%;
    height:100%;

    border-radius:999px;

    background:
    linear-gradient(
        90deg,
        #3b82f6,
        #60a5fa,
        #67e8f9
    );
}

/* ===================================================== */

.info{

    width:84%;

    text-align:center;

    line-height:1.8;

    font-size:0.95rem;

    opacity:0.75;
}

/* ===================================================== */

@media(max-width:430px){

    .clock{
        font-size:5.8rem;
    }

}

</style>
</head>

<body>

<div class="background">

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

</div>

<div class="plane">✈︎</div>

<div class="app">

    <div class="top">

        <div class="logo">
            JETLAG AI
        </div>

        <div class="status" id="status">
            Vol détecté • synchronisation intelligente
        </div>

    </div>

    <div class="center">

        <div class="card">

            <div class="label">
                HEURE CIRCADIENNE
            </div>

            <div class="clock" id="clock">
                00:00
            </div>

            <div class="city" id="city">
                ATLANTIQUE NORD
            </div>

            <div class="zone" id="zone">
                Fuseau horaire survolé : UTC-4
            </div>

            <div class="progress-wrap">

                <div class="row">

                    <span>Progression du vol</span>

                    <span id="percent">
                        0%
                    </span>

                </div>

                <div class="progress">

                    <div class="bar" id="bar"></div>

                </div>

            </div>

            <div class="info" id="info">

                Synchronisation biologique ultra fluide.

            </div>

        </div>

    </div>

</div>

<script>

/* =====================================================
   ÉTOILES
===================================================== */

for(let i=0;i<220;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";

    star.style.opacity=Math.random();

    star.style.animationDelay=
    Math.random()*3+"s";

    document.body.appendChild(star);
}

/* =====================================================
   CONFIG RÉELLE DU VOL
===================================================== */

/*

    Départ :
    18h50 New York

    Heure actuelle :
    19h34 New York

    Temps restant :
    7h09

*/

/*
    Temps déjà écoulé :
    44 minutes
*/

const ELAPSED_MINUTES = 44;

/*
    Temps restant :
*/

const REMAINING_MINUTES =

(7 * 60)
+
9;

/*
    Temps total exact :
*/

const TOTAL_MINUTES =

ELAPSED_MINUTES
+
REMAINING_MINUTES;

/*
    Décalage Barcelone
*/

const DESTINATION_OFFSET = 6;

/* =====================================================
   DÉPART EXACT
===================================================== */

const flightStart =

Date.now()
-
(
    ELAPSED_MINUTES
    *
    60
    *
    1000
);

/* =====================================================
   FUSEAUX HORAIRES
===================================================== */

function getZone(progress){

    if(progress < 0.15){

        return {
            city:"NEW YORK",
            zone:"Fuseau horaire survolé : UTC-4"
        };
    }

    if(progress < 0.35){

        return {
            city:"OCÉAN ATLANTIQUE",
            zone:"Fuseau horaire survolé : UTC-3"
        };
    }

    if(progress < 0.55){

        return {
            city:"ATLANTIQUE CENTRAL",
            zone:"Fuseau horaire survolé : UTC-2"
        };
    }

    if(progress < 0.72){

        return {
            city:"ATLANTIQUE EST",
            zone:"Fuseau horaire survolé : UTC-1"
        };
    }

    if(progress < 0.88){

        return {
            city:"EUROPE",
            zone:"Fuseau horaire survolé : UTC+0"
        };
    }

    return {
        city:"BARCELONE",
        zone:"Fuseau horaire survolé : UTC+1"
    };
}

/* =====================================================
   HORLOGE ULTRA FLUIDE
===================================================== */

function update(){

    const now = new Date();

    /*
        temps écoulé
    */

    const elapsedMs =

    Date.now()
    -
    flightStart;

    /*
        progression réelle
    */

    const progress =

    Math.min(
        elapsedMs
        /
        (
            TOTAL_MINUTES
            *
            60
            *
            1000
        ),
        1
    );

    /*
        courbe ultra fluide
    */

    const smooth =

    (
        1
        -
        Math.cos(progress * Math.PI)
    )
    /
    2;

    /*
        décalage progressif
    */

    const shift =

    DESTINATION_OFFSET
    *
    smooth;

    /*
        heure adaptée
    */

    const adapted =

    new Date(
        now.getTime()
        +
        (
            shift
            *
            3600000
        )
    );

    const h =

    String(
        adapted.getHours()
    )
    .padStart(2,"0");

    const m =

    String(
        adapted.getMinutes()
    )
    .padStart(2,"0");

    document.getElementById("clock")
    .innerText =
    `${h}:${m}`;

    /* =====================================================
       FUSEAU
    ===================================================== */

    const zoneData =
    getZone(progress);

    document.getElementById("city")
    .innerText =
    zoneData.city;

    document.getElementById("zone")
    .innerText =
    zoneData.zone;

    /* =====================================================
       PROGRESSION
    ===================================================== */

    document.getElementById("bar")
    .style.width =
    (
        progress
        *
        100
    )
    +
    "%";

    document.getElementById("percent")
    .innerText =
    Math.round(progress * 100)
    +
    "%";

    /* =====================================================
       TEMPS RESTANT
    ===================================================== */

    const remainingMs =

    Math.max(
        (
            TOTAL_MINUTES
            *
            60
            *
            1000
        )
        -
        elapsedMs,
        0
    );

    const remainingHours =

    Math.floor(
        remainingMs
        /
        3600000
    );

    const remainingMinutes =

    Math.floor(
        (
            remainingMs
            %
            3600000
        )
        /
        60000
    );

    /* =====================================================
       INFOS
    ===================================================== */

    document.getElementById("info")
    .innerHTML =

    `
    Décalage biologique actuel :
    +${shift.toFixed(2)}h

    <br><br>

    Temps restant :
    ${remainingHours}h${String(remainingMinutes).padStart(2,"0")}

    <br><br>

    Progression réelle du vol :
    ${Math.round(progress * 100)}%
    `;

    requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
