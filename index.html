<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8"/>

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
viewport-fit=cover,
maximum-scale=1.0,
user-scalable=no"/>

<title>JETLAG AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ======================================================
   RESET
====================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000814;
    font-family:'Inter',sans-serif;
    color:white;
}

/* ======================================================
   BACKGROUND PREMIUM
====================================================== */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;

    background:
    radial-gradient(circle at top,
    #0f172a 0%,
    #020617 45%,
    #000000 100%);
}

/* ======================================================
   GLOWS
====================================================== */

.glow1,
.glow2,
.glow3{
    position:absolute;
    border-radius:50%;
    filter:blur(120px);
}

.glow1{
    width:520px;
    height:520px;
    background:rgba(96,165,250,0.18);
    top:-180px;
    left:-120px;
    animation:float1 18s ease-in-out infinite;
}

.glow2{
    width:420px;
    height:420px;
    background:rgba(103,232,249,0.12);
    bottom:-150px;
    right:-120px;
    animation:float2 22s ease-in-out infinite;
}

.glow3{
    width:280px;
    height:280px;
    background:rgba(255,255,255,0.05);
    top:40%;
    left:40%;
    animation:float3 14s ease-in-out infinite;
}

@keyframes float1{
    0%{transform:translate(0,0);}
    50%{transform:translate(40px,30px);}
    100%{transform:translate(0,0);}
}

@keyframes float2{
    0%{transform:translate(0,0);}
    50%{transform:translate(-35px,-45px);}
    100%{transform:translate(0,0);}
}

@keyframes float3{
    0%{transform:translate(0,0);}
    50%{transform:translate(20px,-20px);}
    100%{transform:translate(0,0);}
}

/* ======================================================
   ÉTOILES
====================================================== */

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:white;
    opacity:0.6;
    animation:twinkle 3s infinite;
}

@keyframes twinkle{
    0%{opacity:0.2;}
    50%{opacity:1;}
    100%{opacity:0.2;}
}

/* ======================================================
   AVION
====================================================== */

.plane{
    position:absolute;
    top:18%;
    left:-100px;
    font-size:24px;
    opacity:0.85;

    animation:fly 28s linear infinite;

    filter:
    drop-shadow(
    0 0 12px rgba(255,255,255,0.4)
    );
}

@keyframes fly{

    from{
        transform:translateX(0) translateY(0);
    }

    50%{
        transform:translateX(60vw) translateY(-12px);
    }

    to{
        transform:translateX(140vw) translateY(0);
    }
}

/* ======================================================
   APP
====================================================== */

.app{

    position:relative;
    z-index:10;

    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    padding:
    max(26px, env(safe-area-inset-top))
    18px
    max(28px, env(safe-area-inset-bottom));
}

/* ======================================================
   TOP
====================================================== */

.top{

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:18px;
}

.logo{

    font-size:1rem;
    letter-spacing:8px;
    opacity:0.72;
    font-weight:600;
}

.status{

    display:flex;
    align-items:center;
    gap:10px;

    padding:14px 20px;

    border-radius:999px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.10);

    backdrop-filter:blur(20px);

    font-size:0.92rem;
}

.dot{

    width:10px;
    height:10px;

    border-radius:50%;

    background:#22c55e;

    box-shadow:0 0 14px #22c55e;

    animation:pulse 1.8s infinite;
}

@keyframes pulse{

    0%{transform:scale(1);}
    50%{transform:scale(1.5);}
    100%{transform:scale(1);}
}

/* ======================================================
   CENTER
====================================================== */

.center{

    flex:1;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:18px 0;
}

/* ======================================================
   CLOCK CARD
====================================================== */

.clock-card{

    position:relative;

    width:100%;
    height:100%;

    border-radius:42px;

    overflow:hidden;

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,0.10),
        rgba(255,255,255,0.05)
    );

    border:1px solid rgba(255,255,255,0.10);

    backdrop-filter:blur(30px);

    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    align-items:center;

    box-shadow:
    0 0 90px rgba(96,165,250,0.12);
}

/* reflet premium */

.clock-card::before{

    content:"";

    position:absolute;

    top:-20%;
    left:-40%;

    width:180%;
    height:40%;

    transform:rotate(-12deg);

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.08),
        transparent
    );

    animation:shine 10s linear infinite;
}

@keyframes shine{

    from{
        transform:
        rotate(-12deg)
        translateX(-40%);
    }

    to{
        transform:
        rotate(-12deg)
        translateX(40%);
    }
}

/* ======================================================
   LABEL
====================================================== */

.label{

    font-size:1rem;

    letter-spacing:6px;

    opacity:0.72;
}

/* ======================================================
   HORLOGE
====================================================== */

.clock{

    font-size:7rem;

    font-weight:700;

    letter-spacing:4px;

    line-height:1;

    text-shadow:
    0 0 18px rgba(255,255,255,0.15),
    0 0 40px rgba(96,165,250,0.42),
    0 0 70px rgba(103,232,249,0.20);
}

/* ======================================================
   CITY
====================================================== */

.city{

    font-size:1.1rem;

    letter-spacing:6px;

    opacity:0.75;
}

/* ======================================================
   PROGRESS
====================================================== */

.progress-container{

    width:88%;
}

.row{

    display:flex;
    justify-content:space-between;

    margin-bottom:16px;

    font-size:0.95rem;
}

.progress{

    width:100%;
    height:14px;

    border-radius:999px;

    overflow:hidden;

    background:rgba(255,255,255,0.08);
}

.progress-bar{

    width:0%;
    height:100%;

    border-radius:999px;

    background:
    linear-gradient(
        90deg,
        #3b82f6,
        #60a5fa,
        #67e8f9
    );

    box-shadow:
    0 0 18px rgba(96,165,250,0.4);
}

/* ======================================================
   INFO
====================================================== */

.info{

    width:82%;

    text-align:center;

    line-height:1.8;

    font-size:0.95rem;

    opacity:0.74;
}

/* ======================================================
   BACKUP MODE
====================================================== */

.backup{

    width:88%;

    padding:16px 20px;

    border-radius:24px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    text-align:center;

    line-height:1.7;

    font-size:0.9rem;

    opacity:0.78;
}

/* ======================================================
   IPHONE 12
====================================================== */

@media(max-width:430px){

    .clock{
        font-size:5.8rem;
    }

}

</style>
</head>

<body>

<!-- BACKGROUND -->

<div class="background">

    <div class="glow1"></div>
    <div class="glow2"></div>
    <div class="glow3"></div>

</div>

<!-- AVION -->

<div class="plane">✈︎</div>

<!-- APP -->

<div class="app">

    <!-- TOP -->

    <div class="top">

        <div class="logo">
            JETLAG AI
        </div>

        <div class="status">

            <div class="dot"></div>

            <span id="status">
                En attente du décollage réel
            </span>

        </div>

    </div>

    <!-- CENTER -->

    <div class="center">

        <div class="clock-card">

            <div class="label">
                HEURE CIRCADIENNE
            </div>

            <div class="clock" id="clock">
                00:00
            </div>

            <div class="city" id="city">
                NEW YORK
            </div>

            <div class="progress-container">

                <div class="row">

                    <span>
                        Adaptation biologique
                    </span>

                    <span id="percent">
                        0%
                    </span>

                </div>

                <div class="progress">

                    <div class="progress-bar"
                    id="bar"></div>

                </div>

            </div>

            <div class="info" id="info">

                Synchronisation progressive ultra fluide du rythme biologique entre New York et Paris.

            </div>

            <div class="backup" id="backup">

                Système de secours prêt • fonctionnement autonome hors ligne total.

            </div>

        </div>

    </div>

</div>

<script>

/* ======================================================
   ÉTOILES
====================================================== */

for(let i=0;i<200;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";

    star.style.opacity=Math.random();

    star.style.animationDelay=
    Math.random()*3+"s";

    document.body.appendChild(star);
}

/* ======================================================
   CONFIG
====================================================== */

const DESTINATION_OFFSET = 6;
const FLIGHT_DURATION_HOURS = 7;

/* ======================================================
   ÉTAT VOL
====================================================== */

let started = false;
let flightStart = 0;

let offlineTimer = null;

/* ======================================================
   SAUVEGARDE AUTONOME
====================================================== */

function saveState(){

    localStorage.setItem(
        "flightStart",
        flightStart
    );

    localStorage.setItem(
        "flightStarted",
        started
    );
}

function loadState(){

    const savedStart =
    localStorage.getItem("flightStart");

    const savedStarted =
    localStorage.getItem("flightStarted");

    if(savedStart && savedStarted === "true"){

        started = true;

        flightStart = Number(savedStart);

        document.getElementById("status")
        .innerText =
        "Vol en cours • mode autonome";

        document.getElementById("backup")
        .innerHTML =
        "Mode secours actif • fonctionnement hors ligne.";
    }
}

loadState();

/* ======================================================
   DÉTECTION ULTRA PRÉCISE
====================================================== */

window.addEventListener("offline",()=>{

    document.getElementById("backup")
    .innerHTML =
    "Connexion perdue • vérification du décollage...";

    offlineTimer = setTimeout(()=>{

        /*
            si toujours hors ligne
        */

        if(!navigator.onLine && !started){

            const confirmFlight = confirm(
                "Le vol a-t-il réellement décollé ?"
            );

            if(confirmFlight){

                startFlight();

            }else{

                document.getElementById("backup")
                .innerHTML =
                "Mode attente • avion non détecté.";
            }
        }

    },300000); // 5 minutes
});

/* ======================================================
   RETOUR INTERNET
====================================================== */

window.addEventListener("online",()=>{

    clearTimeout(offlineTimer);

    document.getElementById("backup")
    .innerHTML =
    "Connexion détectée • attente du décollage.";
});

/* ======================================================
   DOUBLE TAP MANUEL
====================================================== */

document.body.addEventListener(
"dblclick",
()=>{

    if(!started){

        const confirmFlight = confirm(
            "Démarrer le mode vol ?"
        );

        if(confirmFlight){

            startFlight();
        }
    }
});

/* ======================================================
   START
====================================================== */

function startFlight(){

    started = true;

    flightStart = Date.now();

    saveState();

    document.getElementById("status")
    .innerText =
    "Vol détecté • synchronisation active";

    document.getElementById("backup")
    .innerHTML =
    "Horloge autonome activée • aucune connexion nécessaire.";
}

/* ======================================================
   HORLOGE ULTRA FLUIDE
====================================================== */

function update(){

    const now = new Date();

    let progress = 0;
    let shift = 0;

    if(started){

        const elapsed =
        Date.now() - flightStart;

        const total =
        FLIGHT_DURATION_HOURS *
        60 *
        60 *
        1000;

        progress =
        Math.min(elapsed / total,1);

        /*
            courbe ultra naturelle
        */

        const smooth =
        (1 - Math.cos(progress * Math.PI)) / 2;

        shift =
        DESTINATION_OFFSET * smooth;
    }

    /*
        heure fluide parfaite
    */

    const adapted =
    new Date(
        now.getTime() +
        shift * 3600000
    );

    const h =
    String(adapted.getHours())
    .padStart(2,"0");

    const m =
    String(adapted.getMinutes())
    .padStart(2,"0");

    document.getElementById("clock")
    .innerText = `${h}:${m}`;

    /* villes */

    if(progress < 0.18){

        document.getElementById("city")
        .innerText = "NEW YORK";

    }else if(progress < 0.82){

        document.getElementById("city")
        .innerText = "ATLANTIQUE NORD";

    }else{

        document.getElementById("city")
        .innerText = "PARIS";
    }

    /* progression */

    document.getElementById("bar")
    .style.width =
    progress * 100 + "%";

    document.getElementById("percent")
    .innerText =
    Math.round(progress * 100) + "%";

    /* infos */

    document.getElementById("info")
    .innerHTML =
    started
    ? `Décalage actuel : +${shift.toFixed(2)}h • transition biologique ultra fluide`
    : `Le système attend le vrai départ de l’avion`;

    requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
