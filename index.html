<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8"/>
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>

<title>JetLag AI</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap');

:root{
    --bg:#020617;
    --glass:rgba(255,255,255,0.08);
    --border:rgba(255,255,255,0.12);
    --white:#ffffff;
    --blue:#60a5fa;
    --cyan:#67e8f9;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000814;
    font-family:'Inter',sans-serif;
    color:white;
}

/* BACKGROUND */

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
}

.gradient{
    position:absolute;
    width:160vw;
    height:160vw;
    background:
    radial-gradient(circle,
    rgba(96,165,250,0.20),
    transparent 60%);
    top:-60%;
    left:-30%;
    animation:rotateBg 30s linear infinite;
}

.gradient2{
    position:absolute;
    width:120vw;
    height:120vw;
    background:
    radial-gradient(circle,
    rgba(103,232,249,0.12),
    transparent 60%);
    bottom:-50%;
    right:-30%;
    animation:rotateBg2 24s linear infinite;
}

@keyframes rotateBg{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

@keyframes rotateBg2{
    from{transform:rotate(360deg);}
    to{transform:rotate(0deg);}
}

/* STARS */

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:0.5;
    animation:twinkle 3s infinite;
}

@keyframes twinkle{
    0%{opacity:0.2;}
    50%{opacity:1;}
    100%{opacity:0.2;}
}

/* APP */

.app{
    position:relative;
    z-index:10;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:
        max(24px, env(safe-area-inset-top))
        22px
        max(30px, env(safe-area-inset-bottom));
}

/* TOP */

.top{
    text-align:center;
}

.logo{
    font-size:1rem;
    letter-spacing:5px;
    opacity:0.7;
    margin-bottom:18px;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:12px 18px;
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:999px;
    backdrop-filter:blur(18px);
    font-size:0.9rem;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 12px #22c55e;
    animation:pulse 1.8s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.5);}
    100%{transform:scale(1);}
}

/* CENTER */

.center{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.clock-card{
    width:100%;
    border-radius:40px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(30px);
    padding:42px 20px;
    text-align:center;
    box-shadow:
    0 0 60px rgba(96,165,250,0.12);
}

.label{
    opacity:0.65;
    letter-spacing:4px;
    margin-bottom:18px;
    font-size:0.9rem;
}

.clock{
    font-size:5.3rem;
    font-weight:700;
    line-height:1;
    letter-spacing:2px;
    text-shadow:
        0 0 18px rgba(255,255,255,0.18),
        0 0 35px rgba(96,165,250,0.35);
}

.city{
    margin-top:20px;
    font-size:1rem;
    opacity:0.75;
    letter-spacing:3px;
}

.small{
    margin-top:16px;
    font-size:0.9rem;
    opacity:0.55;
    line-height:1.5;
}

/* BOTTOM */

.bottom{
    width:100%;
}

.panel{
    border-radius:30px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.10);
    backdrop-filter:blur(20px);
    padding:24px;
}

.row{
    display:flex;
    justify-content:space-between;
    margin-bottom:16px;
    font-size:0.95rem;
}

.progress{
    height:12px;
    width:100%;
    border-radius:999px;
    overflow:hidden;
    background:rgba(255,255,255,0.08);
}

.progress-bar{
    width:0%;
    height:100%;
    border-radius:999px;
    background:
    linear-gradient(
        90deg,
        #3b82f6,
        #60a5fa,
        #67e8f9
    );
    transition:width 1s linear;
}

.info{
    margin-top:18px;
    text-align:center;
    font-size:0.92rem;
    opacity:0.75;
    line-height:1.6;
}

/* AIRPLANE */

.plane{
    position:absolute;
    top:52%;
    left:-100px;
    font-size:24px;
    opacity:0.8;
    animation:fly 24s linear infinite;
}

@keyframes fly{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(140vw);
    }
}

/* RESPONSIVE */

@media(max-width:430px){

    .clock{
        font-size:4.4rem;
    }

}

</style>
</head>

<body>

<div class="bg">
    <div class="gradient"></div>
    <div class="gradient2"></div>
</div>

<div class="plane">✈️</div>

<div class="app">

    <!-- TOP -->

    <div class="top">

        <div class="logo">
            JETLAG AI
        </div>

        <div class="status">
            <div class="dot"></div>
            <span id="status">
                En attente du décollage
            </span>
        </div>

    </div>

    <!-- CENTER -->

    <div class="center">

        <div class="clock-card">

            <div class="label">
                HEURE ADAPTATIVE
            </div>

            <div class="clock" id="clock">
                00:00
            </div>

            <div class="city" id="city">
                NEW YORK
            </div>

            <div class="small" id="small">
                Synchronisation précise du fuseau horaire
            </div>

        </div>

    </div>

    <!-- BOTTOM -->

    <div class="bottom">

        <div class="panel">

            <div class="row">
                <span>Adaptation circadienne</span>
                <span id="percent">0%</span>
            </div>

            <div class="progress">
                <div class="progress-bar" id="bar"></div>
            </div>

            <div class="info" id="info">
                Attente du départ réel de l’avion
            </div>

        </div>

    </div>

</div>

<script>

/* ============================================
   ÉTOILES DYNAMIQUES
============================================ */

for(let i=0;i<120;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";

    star.style.animationDelay=
        Math.random()*3+"s";

    star.style.opacity=
        Math.random();

    document.body.appendChild(star);
}

/* ============================================
   CONFIG
============================================ */

const PARIS_OFFSET = 6; // NYC -> Paris
const FLIGHT_DURATION_HOURS = 7;

/* ============================================
   VOL RÉEL
============================================ */

let started=false;
let flightStart=null;

/*
    Le vol démarre uniquement si :

    - l'utilisateur est OFFLINE
    ET
    - il y a eu au moins 2 min sans activité
    OU
    - il clique "décollage"

    Donc :
    pas de faux démarrage à l'aéroport.
*/

/* ============================================
   BOUTON INVISIBLE SMART
============================================ */

document.body.addEventListener("dblclick",()=>{

    if(!started){

        startFlight();
    }
});

/* ============================================
   MODE AVION
============================================ */

function startFlight(){

    started=true;

    flightStart=Date.now();

    localStorage.setItem(
        "flightStart",
        flightStart
    );

    document.getElementById("status")
    .innerText="Vol détecté • adaptation active";
}

/* ============================================
   RESTORE
============================================ */

const saved=
localStorage.getItem("flightStart");

if(saved){

    started=true;
    flightStart=Number(saved);

    document.getElementById("status")
    .innerText="Vol en cours";
}

/* ============================================
   AUTO DÉTECTION PLUS PRÉCISE
============================================ */

window.addEventListener("offline",()=>{

    /*
        On attend un peu après perte réseau
        car à l'aéroport le wifi saute souvent.
    */

    setTimeout(()=>{

        if(!navigator.onLine && !started){

            startFlight();
        }

    },120000); // 2 min
});

/* ============================================
   HORLOGE ULTRA FLUIDE
============================================ */

function update(){

    const now=new Date();

    let progress=0;
    let addedHours=0;

    if(started){

        const elapsed=
            Date.now()-flightStart;

        const total=
            FLIGHT_DURATION_HOURS*
            60*60*1000;

        progress=
            Math.min(elapsed/total,1);

        /*
            Courbe ultra naturelle :
            adaptation biologique douce.
        */

        const smooth=
            (1-Math.cos(progress*Math.PI))/2;

        addedHours=
            PARIS_OFFSET*smooth;
    }

    /*
        HEURE EXACTE
        => jamais de saut
        => dérive parfaite
    */

    const adapted=
        new Date(
            now.getTime()+
            addedHours*3600000
        );

    const h=
    String(adapted.getHours())
    .padStart(2,"0");

    const m=
    String(adapted.getMinutes())
    .padStart(2,"0");

    document.getElementById("clock")
    .innerText=`${h}:${m}`;

    /* VILLES */

    if(progress<0.15){

        document.getElementById("city")
        .innerText="NEW YORK";

    }else if(progress<0.85){

        document.getElementById("city")
        .innerText="OCÉAN ATLANTIQUE";

    }else{

        document.getElementById("city")
        .innerText="PARIS";
    }

    /* UI */

    document.getElementById("percent")
    .innerText=
    Math.round(progress*100)+"%";

    document.getElementById("bar")
    .style.width=
    progress*100+"%";

    document.getElementById("info")
    .innerHTML=
    started
    ? `Décalage progressif actuel : +${addedHours.toFixed(2)}h`
    : `Le système attend le vrai décollage`;

    requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
