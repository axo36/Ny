<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Horloge Vol NYC → Paris</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        background:#050816;
        color:white;
        font-family:Arial, Helvetica, sans-serif;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
    }

    .container{
        text-align:center;
    }

    .label{
        font-size:1.3rem;
        opacity:0.7;
        margin-bottom:20px;
        letter-spacing:2px;
    }

    .clock{
        font-size:7rem;
        font-weight:700;
        letter-spacing:6px;
        text-shadow:
            0 0 10px rgba(255,255,255,0.3),
            0 0 20px rgba(0,140,255,0.5),
            0 0 40px rgba(0,140,255,0.4);
        transition: all 0.1s linear;
    }

    .progress{
        margin-top:40px;
        width:400px;
        height:8px;
        background:rgba(255,255,255,0.1);
        border-radius:999px;
        overflow:hidden;
    }

    .progress-bar{
        height:100%;
        width:0%;
        background:linear-gradient(90deg,#00c6ff,#0072ff);
        transition:width 1s linear;
    }

    .info{
        margin-top:18px;
        opacity:0.7;
        font-size:1rem;
    }

</style>
</head>

<body>

<div class="container">

    <div class="label">
        VOL NEW YORK → PARIS
    </div>

    <div class="clock" id="clock">
        00:00:00
    </div>

    <div class="progress">
        <div class="progress-bar" id="bar"></div>
    </div>

    <div class="info" id="info">
        Transition horaire fluide...
    </div>

</div>

<script>

    /*
        CONFIGURATION
    */

    // Durée totale du vol (en heures)
    const FLIGHT_DURATION_HOURS = 7;

    // Décalage Paris par rapport à New York
    // (souvent +6h)
    const TIME_OFFSET_HOURS = 6;

    // Heure de départ du vol
    const flightStart = Date.now();

    // Durée du vol en millisecondes
    const flightDurationMs =
        FLIGHT_DURATION_HOURS * 60 * 60 * 1000;

    function updateClock(){

        const now = Date.now();

        // Temps écoulé depuis le départ
        const elapsed = now - flightStart;

        // Progression du vol entre 0 et 1
        let progress = elapsed / flightDurationMs;

        // Limite à 100%
        if(progress > 1) progress = 1;

        /*
            TRANSITION FLUIDE

            Au début :
            +0h

            À la fin :
            +6h

            Entre les deux :
            interpolation progressive
        */

        const smoothOffsetHours =
            TIME_OFFSET_HOURS * progress;

        // Temps "modifié"
        const smoothTime =
            new Date(
                now + smoothOffsetHours * 60 * 60 * 1000
            );

        // Affichage
        const hours =
            String(smoothTime.getHours()).padStart(2,'0');

        const minutes =
            String(smoothTime.getMinutes()).padStart(2,'0');

        const seconds =
            String(smoothTime.getSeconds()).padStart(2,'0');

        document.getElementById("clock").innerHTML =
            `${hours}:${minutes}:${seconds}`;

        // Barre de progression
        document.getElementById("bar").style.width =
            `${progress * 100}%`;

        // Texte info
        const addedHours =
            smoothOffsetHours.toFixed(2);

        document.getElementById("info").innerHTML =
            `Décalage appliqué : +${addedHours} h`;

        // Animation ultra fluide
        requestAnimationFrame(updateClock);
    }

    updateClock();

</script>

</body>
</html>
